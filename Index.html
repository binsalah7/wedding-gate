<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة الضيوف</title>
<style>
:root{--bg1:#fdf6ec;--bg2:#f9e8e6;--card:#fffdfa;--tx:#3a2a22;--mut:#8a7468;--bd:#ecd9b8;--gold:#b8892f;--ok:#1b6b3a;--okbg:linear-gradient(135deg,#e4f6e8,#fff1cc);--bad:#b4233a;--badbg:#ffe4e8;--warn:#8a5a00;--warnbg:#fff1cc;--btn:linear-gradient(135deg,#d3ab55,#a8741f);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d1019;--bg2:#2a1424;--card:#2b1927;--tx:#fbeedd;--mut:#cdb6a8;--bd:#52364d;--gold:#e6bd62;--ok:#86e8a8;--okbg:linear-gradient(135deg,#17372b,#3a3010);--bad:#ff9aa8;--badbg:#44171f;--warn:#ffd36b;--warnbg:#3d2e0a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.hero{text-align:center;padding:10px 0 14px}
.orn{color:var(--gold);letter-spacing:8px;font-size:15px}
h1{font-size:26px;margin:2px 0;color:var(--gold);font-weight:800}
.sub{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(184,137,47,.12)}
.stat b{display:block;font-size:26px;color:var(--gold)}.stat span{font-size:12px;color:var(--mut)}
.cam{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:1/1;max-height:60vh;width:100%;border:3px solid var(--gold);box-shadow:0 6px 20px rgba(184,137,47,.25)}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:18%;border:3px solid rgba(255,235,190,.95);border-radius:18px;pointer-events:none}
.msg{margin:12px 0;padding:16px;border-radius:16px;text-align:center;font-size:20px;font-weight:800;background:var(--card);border:1px solid var(--bd)}
.msg small{display:block;font-weight:500;font-size:14px;margin-top:4px}
.msg.ok{background:var(--okbg);color:var(--ok);border-color:var(--gold)}.msg.bad{background:var(--badbg);color:var(--bad)}.msg.warn{background:var(--warnbg);color:var(--warn)}
.row{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;direction:ltr;text-align:left}
button{padding:12px 16px;border-radius:12px;border:0;background:var(--btn);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
h2{font-size:16px;margin:16px 0 8px;color:var(--gold)}
.log{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.item{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bd);font-size:15px}
.item:last-child{border:0}.item span{color:var(--mut)}
.empty{padding:14px;color:var(--mut);text-align:center}
.note{font-size:12px;color:var(--mut);margin-top:10px;text-align:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>
</head>

const $ = id => document.getElementById(id);
let db = null, entries = {}, busy = false, last = "", lastAt = 0;
const KEY='visitor_gate_entries_v1';
let mem={}; try{mem=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
entries=Object.assign({},mem);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){}};

function show(cls, title, sub){
  const m = $("msg"); m.className = "msg " + cls;
  m.textContent = title;
  if(sub){ const s = document.createElement("small"); s.textContent = sub; m.appendChild(s); }
}
function beep(ok){
  try{ const a = new (window.AudioContext||window.webkitAudioContext)(), notes = ok ? [660,880,1100] : [220];
    notes.forEach((f,i)=>{ const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i*.12;
      o.frequency.value = f; g.gain.setValueAtTime(.15,t); g.gain.exponentialRampToValueAtTime(.001,t+(ok?.25:.5));
      o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.5); }); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(ok ? [60,40,60] : [200,100,200]); }catch(e){}
}
function burst(){
  const c = $("fx"), x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#d4af37","#f4c2c2","#ffffff","#e8b4b8","#7ed6a0","#f7e7a1"];
  const P = Array.from({length:110},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:4+Math.random()*6,r:Math.random()*6,c:cols[Math.random()*cols.length|0]}));
  let f = 0;
  (function step(){
    x.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore(); });
    if(++f < 110) requestAnimationFrame(step); else x.clearRect(0,0,W,H);
  })();
}
const fmt = t => new Date(t).toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"});

function render(){
  const list = Object.values(entries).sort((a,b)=>b.at-a.at);
  $("sIn").textContent = list.length; $("sLeft").textContent = TOTAL - list.length; $("sTot").textContent = TOTAL;
  const L = $("log"); L.textContent = "";
  if(!list.length){ const e = document.createElement("div"); e.className="empty"; e.textContent="لا يوجد بعد"; L.appendChild(e); return; }
  list.slice(0,30).forEach(x=>{
    const d = document.createElement("div"); d.className="item";
    const a = document.createElement("b"); a.textContent = "ضيف رقم " + x.n;
    const b = document.createElement("span"); b.textContent = fmt(x.at);
    d.append(a,b); L.appendChild(d);
  });
}

async function check(raw){
  if(busy) return; busy = true;
  try{
    const code = (raw||"").trim().toUpperCase();
    if(!CODES[code]){ beep(false); show("bad","❌ بطاقة غير صالحة","المقروء: " + code.slice(0,40)); return; }
    const n = CODES[code];
    let prev;
    if(db){ const s = await db.doc("entries/" + code).get(); prev = s.exists ? s.data() : null; }
    else prev = mem[code] || null;
    if(prev){ beep(false); show("warn","⛔ البطاقة مستخدمة مسبقاً","ضيف رقم " + n + " دخل الساعة " + fmt(prev.at)); return; }
    const rec = {n, at: Date.now()};
    if(db) await db.doc("entries/" + code).set(rec); else { mem[code] = rec; entries[code] = rec; save(); render(); }
    beep(true); burst(); show("ok","🎉 حيّاكم الله، تفضّلوا","ضيف رقم " + n + " — نوّرتونا");
  }catch(e){
    show("bad","تعذّر الحفظ","تأكد أن لديك صلاحية التعديل وأن الاتصال شغال");
  }finally{ setTimeout(()=>busy=false, 800); }
}

// camera + decoding
let stream = null, odd = "", oddN = 0, dbgT = "";
async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}, audio:false});
    const v = $("v"); v.srcObject = stream; await v.play(); loop();
  }catch(e){ show("warn","الكاميرا المباشرة غير متاحة (" + (e && e.name || "خطأ") + ")","اضغط زر «التقاط صورة للكود» تحت، أو اسمح للكاميرا من إعدادات الموقع"); }
}
function loop(){
  const v = $("v"), c = document.createElement("canvas"), x = c.getContext("2d",{willReadFrequently:true});
  (function tick(){
    if(v.readyState === 4 && !busy){
      const vw = v.videoWidth, vh = v.videoHeight, s = Math.floor(Math.min(vw,vh)*0.8), sx = Math.floor((vw-s)/2), sy = Math.floor((vh-s)/2);
      c.width = c.height = s; x.drawImage(v,sx,sy,s,s,0,0,s,s);
      const r = jsQR(x.getImageData(0,0,s,s).data, s, s, {inversionAttempts:"dontInvert"});
      const t = r && r.data ? "قرأ: " + r.data.slice(0,30) : "لا يوجد كود واضح في الإطار"; if(t !== dbgT){ dbgT = t; $("dbg").textContent = t; }
      if(r && r.data){
        const now = Date.now(), d = r.data.trim().toUpperCase(), okFmt = /^VIS\d{3}-[0-9A-F]{8}$/.test(d);
        if(!okFmt){ if(d === odd) oddN++; else { odd = d; oddN = 1; } }
        if(okFmt || oddN >= 3){
          if(d !== last || now - lastAt > 3000){ last = d; lastAt = now; oddN = 0; check(d); }
        }
      }
    }
    requestAnimationFrame(tick);
  })();
}
$("cam").onclick = startCam;
$("snap").onclick = () => $("file").click();
$("file").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => {
    const c = document.createElement("canvas"), s = Math.min(1, 1400 / Math.max(img.width, img.height));
    c.width = img.width * s; c.height = img.height * s;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, c.width, c.height);
    const r = jsQR(x.getImageData(0, 0, c.width, c.height).data, c.width, c.height, {inversionAttempts:"attemptBoth"});
    URL.revokeObjectURL(u); e.target.value = "";
    if(r && r.data) check(r.data); else show("warn", "ما قدرت أقرأ الكود", "قرّب الكاميرا وخلّ الكود واضح وكامل داخل الصورة");
  };
  img.src = u;
};
$("go").onclick = () => { check($("man").value); $("man").value = ""; };
$("man").onkeydown = e => { if(e.key === "Enter") $("go").click(); };

$("sync").textContent = "";
$("reset").onclick = () => { if(confirm("تصفير سجل الدخول؟ ستصبح كل الأكواد صالحة من جديد.")){ mem={}; entries={}; save(); render(); show("","تم تصفير السجل"); } };
const EVENT_TITLE = "حفل الزواج";
$("evt").textContent = "💍 " + EVENT_TITLE; document.title = EVENT_TITLE;
render(); startCam();
</script>
